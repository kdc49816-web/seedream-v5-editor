<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090a0b" />
  <title>Seedream Studio</title>
  <style>
    html,body{height:100%;margin:0;background:#090a0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}
    a{color:#d7ff43}
  </style>
  <script>
    (async()=>{
      try{
        if('caches' in window){for(const key of await caches.keys())if(key.startsWith('seedream-shell-'))await caches.delete(key)}
        if('serviceWorker' in navigator){
          const reg=await navigator.serviceWorker.register('../preview-v13/sw.js?v=37',{scope:'../preview-v13/'});
          await reg.update().catch(()=>{});
          if(reg.installing) await new Promise(resolve=>{const w=reg.installing;w.addEventListener('statechange',()=>{if(w.state==='activated'||w.state==='redundant')resolve()})});
        }
      }catch{}
      location.replace('../preview-v13/?v=37');
    })();
  </script>
</head>
<body>
  <p>正在打开 Seedream Studio… <a href="../preview-v13/?v=37">点这里进入</a></p>
</body>
</html>
