name: Deploy Seedream Icon
on:
  push:
    paths:
      - '.github/workflows/deploy-seedream-icon.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Decode new icon and build sizes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          b64=''''''
          p=Path('preview-v13')
          p.mkdir(parents=True, exist_ok=True)
          (p/'sd-icon-180-v32.png').write_bytes(base64.b64decode(b64))
          PY
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path
          p=Path('preview-v13')
          im=Image.open(p/'sd-icon-180-v32.png').convert('RGB')
          for size in (192,512):
              out=im.resize((size,size), Image.Resampling.LANCZOS)
              out.save(p/f'sd-icon-{size}-v32.png','PNG',optimize=True)
          PY
      - name: Switch site to v32 icon paths
        shell: bash
        run: |
          sed -i 's/sd-icon-180-v31.png/sd-icon-180-v32.png/g; s/manifest.webmanifest?v=31/manifest.webmanifest?v=32/g; s/mobile.js?v=31/mobile.js?v=32/g' preview-v13/index.html
          sed -i 's/sd-icon-192-v31.png/sd-icon-192-v32.png/g; s/sd-icon-512-v31.png/sd-icon-512-v32.png/g' preview-v13/manifest.webmanifest
          sed -i 's/seedream-shell-31/seedream-shell-32/g; s/sd-icon-180-v31.png/sd-icon-180-v32.png/g; s/manifest.webmanifest?v=31/manifest.webmanifest?v=32/g; s/mobile.js?v=31/mobile.js?v=32/g' preview-v13/sw.js
          sed -i 's/sw.js?v=31/sw.js?v=32/g' preview-v13/mobile.js
          if [ -f studio/index.html ]; then sed -i 's/preview-v13\/?v=31/preview-v13\/?v=32/g' studio/index.html; fi
          rm -f preview-v13/.uploading-icon preview-v13/upload-test.txt preview-v13/sd-icon-upload-note.txt preview-v13/sd-icon-180-v32.b64.txt
      - name: Commit to gh-pages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-v13 studio || true
          git commit -m 'Deploy new Seedream v32 app icon' || exit 0
          git push origin gh-pages
